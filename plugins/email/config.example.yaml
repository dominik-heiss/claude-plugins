# Copy to your config dir (printed by `python -m email_skill setup`)
# or let the setup wizard create it for you.

imap_host: mail.example.com
imap_port: 993
smtp_host: mail.example.com
smtp_port: 587            # 587 = STARTTLS, 465 = implicit TLS
username: you@example.com
use_ssl_imap: true
use_starttls_smtp: true   # false if smtp_port is 465
from_name: Your Name      # optional display name in the From header
