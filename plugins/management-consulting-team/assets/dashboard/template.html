<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Management Consulting Team Dashboard</title>
<style>
/* ===== Reset & Base ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 14px; scroll-behavior: smooth; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  color: #202124; background: #f8f9fa; line-height: 1.6;
  display: flex; min-height: 100vh;
}

/* ===== Sidebar ===== */
.sidebar {
  width: 260px; min-width: 260px; background: #fff;
  border-right: 1px solid #dadce0; display: flex; flex-direction: column;
  position: fixed; top: 0; left: 0; bottom: 0; z-index: 10; overflow-y: auto;
}
.sidebar-header { padding: 24px 20px 16px; border-bottom: 1px solid #e8eaed; }
.sidebar-header h1 { font-size: 18px; font-weight: 500; letter-spacing: -0.2px; }
.sidebar-header .sub { font-size: 12px; color: #5f6368; margin-top: 4px; }
.sidebar-header .phase-badge {
  display: inline-block; font-size: 11px; padding: 2px 10px;
  border-radius: 12px; background: #e8f0fe; color: #1a73e8;
  margin-top: 8px; font-weight: 500;
}
.nav-list { list-style: none; padding: 8px 0; flex: 1; }
.nav-item {
  display: flex; align-items: center; padding: 8px 20px;
  color: #5f6368; text-decoration: none; font-size: 13px; font-weight: 500;
  cursor: pointer; transition: background 0.15s, color 0.15s;
  border-radius: 0 24px 24px 0; margin-right: 12px;
}
.nav-item:hover { background: #f1f3f4; color: #202124; }
.nav-item.active { background: #e8f0fe; color: #1a73e8; }
.nav-icon { margin-right: 12px; font-size: 15px; width: 20px; text-align: center; }
.nav-count {
  margin-left: auto; font-size: 11px; color: #80868b; font-weight: 400;
  background: #f1f3f4; padding: 1px 7px; border-radius: 10px;
}
.nav-sep { height: 1px; background: #e8eaed; margin: 6px 20px; }
.sidebar-footer { padding: 12px 20px; border-top: 1px solid #e8eaed; font-size: 11px; color: #80868b; }

/* ===== Main ===== */
.main { margin-left: 260px; flex: 1; padding: 24px 32px; max-width: 1100px; }
.section { display: none; }
.section.active { display: block; }
.section-title { font-size: 22px; font-weight: 400; margin-bottom: 20px; }

/* ===== Phase Progress ===== */
.phase-progress { display: flex; align-items: flex-start; margin-bottom: 24px; gap: 0; }
.phase-step {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 12px 8px 10px; flex: 1;
  font-size: 12px; color: #5f6368; background: #f1f3f4; position: relative;
  text-align: center; cursor: pointer; transition: background 0.15s;
}
.phase-step:first-child { border-radius: 8px 0 0 8px; }
.phase-step:last-child { border-radius: 0 8px 8px 0; }
.phase-step.done { background: #e6f4ea; color: #137333; }
.phase-step.current { background: #e8f0fe; color: #1a73e8; font-weight: 600; }
.phase-step.upcoming { background: #f1f3f4; color: #9aa0a6; }
.phase-dot {
  width: 28px; height: 28px; border-radius: 50%; display: flex;
  align-items: center; justify-content: center; font-size: 13px;
  background: #dadce0; color: #fff; font-weight: 700; flex-shrink: 0;
}
.phase-step.done .phase-dot { background: #34a853; }
.phase-step.current .phase-dot { background: #1a73e8; }
.phase-label { font-size: 13px; font-weight: 500; white-space: nowrap; }
.phase-goal {
  display: none; font-size: 11px; color: #5f6368; margin-top: 2px;
  white-space: normal; max-width: 180px; line-height: 1.4;
}
.phase-goal.open { display: block; }
.phase-connector {
  width: 0; height: 2px; background: #dadce0; flex-shrink: 0;
  align-self: center; margin-top: 14px;
  flex: 0 0 2px; min-width: 2px;
}
.phase-step.done + .phase-connector { background: #34a853; }

/* ===== Cards ===== */
.card { background: #fff; border-radius: 8px; border: 1px solid #dadce0; padding: 20px; margin-bottom: 16px; }
.card-title { font-size: 14px; font-weight: 500; margin-bottom: 12px; }
.card-subtitle { font-size: 12px; color: #5f6368; margin-bottom: 8px; }

/* ===== Stats Grid ===== */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
.stat-card { background: #fff; border: 1px solid #dadce0; border-radius: 8px; padding: 16px; text-align: center; }
.stat-value { font-size: 28px; font-weight: 500; color: #1a73e8; }
.stat-label { font-size: 12px; color: #5f6368; margin-top: 4px; }

/* ===== Badges ===== */
.badge { display: inline-block; font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 12px; white-space: nowrap; }
.badge-confirmed, .badge-supported, .badge-complete, .badge-pass, .badge-done { background: #e6f4ea; color: #137333; }
.badge-supported-with-urgency { background: #e6f4ea; color: #137333; }
.badge-testing, .badge-in-progress, .badge-active { background: #e8f0fe; color: #1a73e8; }
.badge-rejected, .badge-contradicted, .badge-fail { background: #fce8e6; color: #c5221f; }
.badge-refined, .badge-conditional, .badge-conditionally-supported, .badge-conditional-pass { background: #fef7e0; color: #b06000; }
.badge-partially-supported { background: #fef7e0; color: #b06000; }
.badge-not-started, .badge-pending { background: #f1f3f4; color: #5f6368; }
.badge-on-hold { background: #f1f3f4; color: #80868b; }

/* ===== Tables ===== */
.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.data-table th {
  text-align: left; padding: 8px 12px; border-bottom: 2px solid #e8eaed;
  color: #5f6368; font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px;
}
.data-table td { padding: 10px 12px; border-bottom: 1px solid #f1f3f4; vertical-align: top; }
.data-table tr:hover td { background: #f8f9fa; }
.data-table th:nth-child(1), .data-table td:nth-child(1) { word-break: break-word; }
.prev-toggle { font-size: 11px; color: #1a73e8; cursor: pointer; margin-left: 6px; }
.prev-toggle:hover { text-decoration: underline; }
.prev-row td { background: #fafafa; font-size: 12px; color: #5f6368; padding: 6px 12px; }

/* ===== Hypothesis Tree ===== */
.hyp-item { padding: 12px 16px; border: 1px solid #e8eaed; border-radius: 8px; margin-bottom: 8px; background: #fff; }
.hyp-header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.hyp-id { font-weight: 600; font-size: 13px; color: #5f6368; min-width: 32px; }
.hyp-statement { flex: 1; font-size: 14px; min-width: 200px; }
.hyp-confidence { font-size: 12px; color: #80868b; }
.hyp-evidence { margin-top: 8px; font-size: 12px; color: #5f6368; }
.hyp-children { margin-top: 8px; margin-left: 20px; }
.hyp-children .hyp-item { border-left: 3px solid #dadce0; border-radius: 0 8px 8px 0; }
.hyp-critical { border-left: 3px solid #1a73e8; }

/* ===== Hypothesis Tooltip ===== */
.hyp-ref {
  position: relative; cursor: help; border-bottom: 1px dotted #5f6368;
  font-weight: 500; color: #1a73e8;
}
.hyp-ref:hover::after {
  content: attr(data-tip); position: absolute; bottom: calc(100% + 6px);
  left: 50%; transform: translateX(-50%); background: #333; color: #fff;
  padding: 8px 12px; border-radius: 6px; font-size: 12px; font-weight: 400;
  white-space: normal; width: max-content; max-width: 320px; z-index: 100;
  pointer-events: none; line-height: 1.4; box-shadow: 0 2px 8px rgba(0,0,0,.2);
}

/* ===== Document Accordion ===== */
.doc-item { border: 1px solid #e8eaed; border-radius: 8px; margin-bottom: 8px; overflow: hidden; }
.doc-header {
  display: flex; align-items: center; padding: 12px 16px;
  cursor: pointer; background: #fff; transition: background 0.15s; gap: 8px;
}
.doc-header:hover { background: #f8f9fa; }
.doc-icon { font-size: 16px; flex-shrink: 0; }
.doc-name { font-size: 13px; font-weight: 500; flex: 1; }
.doc-badge { font-size: 11px; color: #80868b; }
.doc-toggle { color: #80868b; font-size: 12px; transition: transform 0.2s; flex-shrink: 0; }
.doc-item.open .doc-toggle { transform: rotate(90deg); }
.doc-content {
  display: none; padding: 16px 20px; border-top: 1px solid #e8eaed;
  background: #fafafa; font-size: 13px; line-height: 1.7;
  white-space: normal; word-wrap: break-word; overflow-wrap: break-word;
  position: relative;
}
.copy-md-btn {
  position: absolute; top: 8px; right: 12px; z-index: 5;
  background: #fff; border: 1px solid #dadce0; border-radius: 6px;
  padding: 4px 10px; font-size: 11px; color: #5f6368; cursor: pointer;
  font-family: inherit; line-height: 1;
}
.copy-md-btn:hover { background: #f1f3f4; border-color: #1a73e8; color: #1a73e8; }
.doc-item.open .doc-content { display: block; }
.prev-versions { font-size: 12px; color: #80868b; margin: -4px 0 8px 44px; }
.prev-versions a { color: #5f6368; margin-right: 6px; cursor: pointer; }
.prev-versions a:hover { color: #1a73e8; }
.prev-doc-hidden { display: none; }
.prev-doc-visible { display: block; }

/* ===== Rendered Markdown ===== */
.md h1 { font-size: 20px; font-weight: 500; margin: 20px 0 12px; }
.md h2 { font-size: 17px; font-weight: 500; margin: 18px 0 10px; }
.md h3 { font-size: 15px; font-weight: 500; margin: 16px 0 8px; }
.md h4 { font-size: 14px; font-weight: 600; margin: 14px 0 6px; }
.md p { margin: 8px 0; }
.md ul, .md ol { padding-left: 24px; margin: 8px 0; }
.md li { margin: 4px 0; }
.md code { background: #f1f3f4; padding: 2px 6px; border-radius: 4px; font-family: 'Consolas','Monaco',monospace; font-size: 12px; }
.md pre { background: #f8f9fa; border: 1px solid #e8eaed; border-radius: 8px; padding: 16px; overflow-x: auto; margin: 12px 0; white-space: pre-wrap; word-wrap: break-word; }
.md pre code { background: none; padding: 0; }
.md blockquote { border-left: 4px solid #1a73e8; padding: 8px 16px; margin: 12px 0; background: #f8f9fa; color: #5f6368; }
.md table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 13px; }
.md th { text-align: left; padding: 8px 12px; border-bottom: 2px solid #e8eaed; background: #f8f9fa; font-weight: 500; }
.md td { padding: 8px 12px; border-bottom: 1px solid #f1f3f4; }
.md a { color: #1a73e8; text-decoration: none; }
.md a:hover { text-decoration: underline; }
.md hr { border: none; border-top: 1px solid #e8eaed; margin: 16px 0; }
.md strong { font-weight: 600; }

/* ===== Team Grid ===== */
.team-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; margin-bottom: 20px; }
.team-card { background: #fff; border: 1px solid #dadce0; border-radius: 8px; padding: 20px; border-top: 3px solid #1a73e8; }
.team-card .t-name { font-size: 16px; font-weight: 500; }
.team-card .t-role { font-size: 12px; color: #5f6368; margin-top: 2px; }
.team-card .t-bg { font-size: 13px; margin-top: 8px; color: #3c4043; }
.team-card .t-style { font-size: 12px; color: #5f6368; margin-top: 4px; font-style: italic; }
.team-card .t-links { margin-top: 10px; display: flex; gap: 8px; }
.team-card .t-link {
  font-size: 11px; padding: 3px 10px; border-radius: 4px; border: 1px solid #dadce0;
  color: #5f6368; cursor: pointer; background: #fff; text-decoration: none;
  transition: background 0.15s;
}
.team-card .t-link:hover { background: #f1f3f4; color: #202124; }

/* ===== Loop Cards ===== */
.loop-card { border-left: 4px solid #1a73e8; }
.loop-card.work { border-left-color: #34a853; }
.loop-card.checkpoint { border-left-color: #f9ab00; }
.loop-card.phase-gate { border-left-color: #ea4335; }

/* ===== Engagement Model Diagram ===== */
.model-diagram {
  background: #fff; border: 1px solid #dadce0; border-radius: 12px;
  padding: 28px; margin-bottom: 20px;
}
.model-phases {
  display: flex; align-items: stretch; gap: 0; margin-bottom: 24px;
  border: 2px solid #e8eaed; border-radius: 10px; overflow: hidden;
}
.model-phase {
  flex: 1; padding: 16px 12px; text-align: center; position: relative;
  background: #f8f9fa; border-right: 1px solid #e8eaed;
}
.model-phase:last-child { border-right: none; }
.model-phase.mp-done { background: #e6f4ea; }
.model-phase.mp-current { background: #e8f0fe; }
.model-phase-id { font-size: 11px; font-weight: 600; color: #80868b; text-transform: uppercase; letter-spacing: 0.5px; }
.model-phase.mp-done .model-phase-id { color: #137333; }
.model-phase.mp-current .model-phase-id { color: #1a73e8; }
.model-phase-name { font-size: 15px; font-weight: 500; margin-top: 4px; }
.model-phase-gate {
  position: absolute; right: -12px; top: 50%; transform: translateY(-50%);
  width: 24px; height: 24px; background: #fff; border: 2px solid #dadce0;
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-size: 11px; z-index: 2; color: #80868b;
}
.model-phase.mp-done .model-phase-gate { border-color: #34a853; color: #34a853; }
.model-phase:last-child .model-phase-gate { display: none; }

.loop-diagram {
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-top: 20px;
}
.loop-box {
  border-radius: 10px; padding: 20px; position: relative;
}
.loop-box.lb-work { background: #e6f4ea; border: 1px solid #b7dfbf; }
.loop-box.lb-checkpoint { background: #fef7e0; border: 1px solid #f5dfa0; }
.loop-box.lb-phasegate { background: #fce8e6; border: 1px solid #f5b7b1; }
.loop-box-title { font-size: 14px; font-weight: 600; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
.loop-box.lb-work .loop-box-title { color: #137333; }
.loop-box.lb-checkpoint .loop-box-title { color: #b06000; }
.loop-box.lb-phasegate .loop-box-title { color: #c5221f; }
.loop-box-freq { font-size: 11px; color: #5f6368; font-weight: 400; font-style: italic; }
.loop-box-desc { font-size: 12px; color: #3c4043; margin-bottom: 8px; line-height: 1.5; }
.loop-box-flow {
  display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
  font-size: 11px; color: #5f6368; margin-top: 8px;
}
.loop-box-flow .lf-step {
  background: rgba(255,255,255,.7); padding: 3px 8px; border-radius: 4px;
  white-space: nowrap;
}
.loop-box-flow .lf-arrow { color: #80868b; }

/* ===== Workstream ===== */
.ws-meta { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 8px; font-size: 12px; color: #5f6368; }
.ws-meta span { display: flex; align-items: center; gap: 4px; }
.ws-questions { margin: 8px 0; padding-left: 20px; font-size: 13px; }
.ws-questions li { margin: 4px 0; }

/* ===== KV Grid ===== */
.kv-grid { display: grid; grid-template-columns: 160px 1fr; gap: 4px 16px; font-size: 13px; }
.kv-key { color: #5f6368; font-weight: 500; }
.kv-value { color: #202124; }

/* ===== Empty State ===== */
.empty-state { text-align: center; padding: 40px 20px; color: #80868b; }
.empty-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.4; }
.empty-text { font-size: 14px; }

/* ===== Checklist ===== */
.checklist { list-style: none; }
.checklist li { padding: 6px 0; font-size: 13px; display: flex; align-items: center; gap: 8px; }

/* ===== Source reliability ===== */
.rel-high { color: #137333; font-weight: 500; }
.rel-medium { color: #b06000; font-weight: 500; }
.rel-low { color: #c5221f; font-weight: 500; }

/* ===== Section group label ===== */
.group-label { font-size: 12px; font-weight: 500; color: #5f6368; text-transform: uppercase; letter-spacing: 0.5px; margin: 20px 0 8px; }
.group-label:first-child { margin-top: 0; }

/* ===== Agent memory modal ===== */
.modal-overlay {
  display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,.4); z-index: 100; align-items: center; justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal {
  background: #fff; border-radius: 12px; max-width: 700px; width: 90%;
  max-height: 80vh; overflow-y: auto; padding: 24px; position: relative;
  box-shadow: 0 8px 32px rgba(0,0,0,.2);
}
.modal-close {
  position: absolute; top: 12px; right: 16px; font-size: 20px;
  cursor: pointer; color: #5f6368; background: none; border: none;
}
.modal-title { font-size: 18px; font-weight: 500; margin-bottom: 16px; }

/* ===== Responsive ===== */
@media (max-width: 900px) {
  .sidebar { width: 220px; min-width: 220px; }
  .main { margin-left: 220px; padding: 16px; }
  .phase-progress { flex-wrap: wrap; }
}
</style>
</head>
<body>

<nav class="sidebar">
  <div class="sidebar-header">
    <h1>Management Consulting Team Dashboard</h1>
    <p class="sub" id="sidebar-name"></p>
    <span class="phase-badge" id="sidebar-phase"></span>
  </div>
  <ul class="nav-list" id="nav-list"></ul>
  <div class="sidebar-footer">
    <div>Generated: <span id="build-time"></span></div>
    <div style="margin-top:8px"><a href="https://github.com/dominik-heiss/management-consulting-team" target="_blank" style="color:#1a73e8;text-decoration:none">GitHub Repository</a></div>

    <div style="margin-top:4px;font-size:10px;line-height:1.4">Disclaimer: All content is generated by AI agents and the sole responsibility of the plugin user. Always verify outputs independently.</div>
  </div>
</nav>

<main class="main" id="main"></main>

<!-- Modal for agent memory/feedback -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <button class="modal-close" onclick="closeModal()">&times;</button>
    <div class="modal-title" id="modal-title"></div>
    <div class="md" id="modal-body"></div>
  </div>
</div>

<script>
// ===================================================================
// Raw markdown store + copy-to-clipboard

    btn.innerHTML = '\u2713 Copied';
    btn.style.color = '#1e8e3e';

    btn.innerHTML = '\u2717 Failed';
    btn.style.color = '#d93025';
    setTimeout(() => { btn.innerHTML = restore; btn.style.color = ''; }, 1500);

}

// ===================================================================
// Markdown Parser
// ===================================================================
function md2html(text) {
  if (!text) return '';
  let html = '', inCode = false, code = '', inList = false, lt = '';
  const lines = text.split('\n');
  for (let i = 0; i < lines.length; i++) {
    let L = lines[i];
    if (L.trim().startsWith('```')) {
      if (inCode) { html += '<pre><code>' + esc(code) + '</code></pre>\n'; code = ''; inCode = false; }
      else { cl(); inCode = true; }

    }

    if (L.match(/^[-*]{3,}\s*$/)) { cl(); html += '<hr>\n'; continue; }
    if (L.match(/^>\s?/)) { cl(); html += '<blockquote>' + inl(L.replace(/^>\s?/, '')) + '</blockquote>\n'; continue; }
    if (L.includes('|') && L.trim().startsWith('|')) {
      cl();
      let rows = [L], hdr = false;
      while (i + 1 < lines.length && lines[i + 1].includes('|')) {
        i++;
        if (lines[i].match(/^\|[\s:|-]+\|$/)) { hdr = true; continue; }
        rows.push(lines[i]);
      }
      html += '<table>';
      rows.forEach((r, ri) => {
        const cells = r.split('|').slice(1, -1);
        const tag = (ri === 0 && hdr) ? 'th' : 'td';
        html += '<tr>' + cells.map(c => `<${tag}>${inl(c.trim())}</${tag}>`).join('') + '</tr>';
      });
      html += '</table>\n'; continue;
    }
    if ((m = L.match(/^\s*[-*]\s+(.+)/))) {
      if (!inList || lt !== 'ul') { cl(); html += '<ul>'; inList = true; lt = 'ul'; }
      html += '<li>' + inl(m[1]) + '</li>'; continue;
    }
    if ((m = L.match(/^\s*\d+\.\s+(.+)/))) {
      if (!inList || lt !== 'ol') { cl(); html += '<ol>'; inList = true; lt = 'ol'; }

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function inl(t) {
  return esc(t)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\*([^*]+)\*/g, '<em>$1</em>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
}

// Humanize filename
function humanName(fn) {
  return fn.replace(/-[Vv]\d+/,'').replace(/\.\w+$/,'').replace(/^[A-Z]\d+-/,'')
    .replace(/[-_]/g,' ').replace(/\b\w/g, c => c.toUpperCase());
}
function getVersion(fn) {
  const m = fn.match(/-[Vv](\d+)/);
  return m ? m[1] : null;
}
function fileIcon(type) {
  if (type === 'md') return '\u{1F4C4}';
  if (type === 'xlsx') return '\u{1F4CA}';
  if (type === 'pptx') return '\u{1F4CA}';
  if (type === 'pdf') return '\u{1F4D5}';
  if (type === 'docx') return '\u{1F4DD}';
  return '\u{1F4CE}';
}

// ===================================================================
// Version grouping
// ===================================================================
function groupVersions(files) {
  const groups = {};
  files.forEach(f => {
    const base = f.filename.replace(/-[Vv]\d+/, '').replace(/\.\w+$/, '');
    if (!groups[base]) groups[base] = { base, name: humanName(f.filename), files: [] };
    groups[base].files.push(f);
  });
  Object.values(groups).forEach(g => {
    g.files.sort((a, b) => {
      const va = getVersion(a.filename) || '00';
      const vb = getVersion(b.filename) || '00';
      return vb.localeCompare(va);
    });
    g.latest = g.files[0];
    g.previous = g.files.slice(1);
  });
  return Object.values(groups);
}

// ===================================================================
// Document rendering with version grouping
// ===================================================================
let docCounter = 0;
function versionedDocList(files, label) {
  if (!files || files.length === 0) return '';
  const groups = groupVersions(files);
  let h = label ? `<div class="group-label">${label}</div>` : '';
  groups.forEach(g => {
    const f = g.latest;
    const id = 'doc' + (docCounter++);
    const ver = getVersion(f.filename);
    h += `<div class="doc-item" id="${id}">`;
    h += `<div class="doc-header" onclick="toggleDoc('${id}')">`;
    h += `<span class="doc-icon">${fileIcon(f.type)}</span>`;
    h += `<span class="doc-name">${esc(g.name)}</span>`;
    if (ver) h += `<span class="doc-badge">V${ver}</span>`;
    if (f.type !== 'md') h += `<span class="doc-badge">${f.type.toUpperCase()}</span>`;
    h += `<span class="doc-toggle">\u25B6</span></div>`;
    if (f.type === 'md' && f.content) {
      _storeMd(id, f.content);
      h += `<div class="doc-content md"><button class="copy-md-btn" title="Copy markdown" onclick="event.stopPropagation();copyMd('${id}', this)">\u{1F4CB} Copy MD</button>${md2html(f.content)}</div>`;
    } else {
      h += `<div class="doc-content"><p>File: <a href="${esc(f.path)}">${esc(f.filename)}</a></p></div>`;
    }
    h += '</div>';
    if (g.previous.length) {
      h += '<div class="prev-versions">Previous: ';
      g.previous.forEach(pf => {
        const pv = getVersion(pf.filename) || '?';
        if (pf.type === 'md') {
          const pid = 'doc' + (docCounter++);
          _storeMd(pid, pf.content);
          h += `<a href="#" onclick="event.preventDefault();togglePrev('${pid}')">V${pv}</a> `;
          h += `<div class="doc-item prev-doc-hidden" id="${pid}">`;
          h += `<div class="doc-content md" style="display:block"><button class="copy-md-btn" title="Copy markdown" onclick="event.stopPropagation();copyMd('${pid}', this)">\u{1F4CB} Copy MD</button>${md2html(pf.content)}</div></div>`;
        } else {
          h += `<a href="${esc(pf.path)}">V${pv} (${pf.type.toUpperCase()})</a> `;
        }
      });
      h += '</div>';
    }
  });
  return h;
}

function toggleDoc(id) {
  const el = document.getElementById(id);

  if (el.tagName === 'TR') {
    el.style.display = el.style.display === 'none' ? 'table-row' : 'none';
  } else {
    el.classList.toggle('open');

}
function togglePrevGroup(groupId) {

function resolveCurrentPhase() {
  // Determine current phase from BOTH engagement.json phase AND gate statuses.
  // The highest phase indicated by either source wins.
  const cp = DATA.engagement?.phase || '';
  const gates = DATA.drumbeat?.phase_gates || [];

  // Phase from engagement.json
  let phaseFromEngagement = -1;
  if (cp) {
    const match = cp.match(/^(\d)/);
    if (match) phaseFromEngagement = parseInt(match[1]);
  }

  // Phase from gate statuses: last passed gate determines completed phase
  let phaseFromGates = -1;
  const gateOrder = ['0', '1', '2', '3'];
  gates.forEach(g => {
    if (g.status === 'passed' || g.status === 'complete') {
      const gateMatch = (g.gate || '').match(/^(\d)/);
      if (gateMatch) {
        const fromPhase = parseInt(gateMatch[1]);
        // Gate "X→Y" means phase X is done, so current is at least Y = fromPhase + 1
        phaseFromGates = Math.max(phaseFromGates, fromPhase + 1);
      }
    }
  });

  return Math.max(phaseFromEngagement, phaseFromGates);
}

let teamCardIdx = 0;
const teamMemKeys = {};

function findAgentMemory(mem, a) {
  // Try multiple lookup strategies to find agent memory
  const name = (a.name || '').toLowerCase();
  const agent = (a.agent || '').toLowerCase();
  // 1. Exact name match (lowercase)
  if (name && mem[name]) return { mem: mem[name], key: name };
  // 2. Exact agent type match
  if (agent && mem[agent]) return { mem: mem[agent], key: agent };
  // 3. Case-insensitive scan of all memory keys
  for (const key of Object.keys(mem)) {
    if (key.toLowerCase() === name || key.toLowerCase() === agent) return { mem: mem[key], key: key };
  }
  // 4. Partial match (name contained in key or vice versa)
  if (name) {
    for (const key of Object.keys(mem)) {
      if (key.toLowerCase().includes(name) || name.includes(key.toLowerCase())) return { mem: mem[key], key: key };
    }
  }
  return { mem: null, key: null };
}

      o += `<tr><td><strong>${esc(g.gate||'')}</strong></td><td>${esc(g.name||'')}</td>`;
      o += `<td style="font-size:12px;color:#5f6368">${esc(g.description||'')}</td>`;
      o += `<td>${badge(g.status||'pending')}</td></tr>`;
    });
    o += '</table>';
    // Show checklists for ALL gates that have them
    gates.forEach(g => {
      if (!g.checklist || !g.checklist.length) return;
      const isDone = g.status === 'passed' || g.status === 'complete';
      const isPending = g.status === 'pending';
      o += `<div style="margin-top:16px"><div class="card-title">${esc(g.name || g.gate)} Checklist ${isDone ? '<span style="color:#34a853;font-size:12px">(completed)</span>' : isPending ? '<span style="color:#ea8600;font-size:12px">(pending)</span>' : ''}</div>`;
      o += '<ul class="checklist">';
      g.checklist.forEach(item => {
        // Support object format: { item: "...", status: "done|pending|skipped" }

          const st = item.status || 'pending';
          const icon = st === 'done' ? '\u2713' : st === 'skipped' ? '\u2014' : '\u25CB';
          const color = st === 'done' ? '#34a853' : st === 'skipped' ? '#5f6368' : '#dadce0';
          const textStyle = st === 'skipped' ? 'text-decoration:line-through;color:#5f6368' : '';
          o += `<li><span style="color:${color}">${icon}</span> <span style="${textStyle}">${esc(item.item || item.name || '')}</span></li>`;

          const icon = isDone ? '\u2713' : '\u25CB';
          const color = isDone ? '#34a853' : '#dadce0';
          o += `<li><span style="color:${color}">${icon}</span> ${esc(item)}</li>`;

    o += '<table class="data-table"><tr><th>Checkpoint</th><th>When</th><th>Status</th></tr>';

  // Checkpoint log
  if (d.checkpoint_log?.length) {
    o += '<div class="card"><div class="card-title">Checkpoint Log</div>';
    o += '<table class="data-table"><tr><th>Date</th><th>Type</th><th>Summary</th><th>Decision</th></tr>';

      o += `<td>${esc(c.summary||'')}</td><td>${esc(c.principal_decision||'')}</td></tr>`;
    });
    o += '</table></div>';
  }

  return o;
}

function renderHypotheses() {
  const h = DATA.hypotheses;
  if (!h) return '<h2 class="section-title">Hypotheses</h2>' + empty('\u{1F9EA}', 'No hypothesis tree.');
  let o = '<h2 class="section-title">Hypotheses</h2>';
  o += '<div class="card"><div class="card-title">Core Question</div>';
  o += `<p style="font-size:16px">${esc(h.core_question || '\u2014')}</p>`;
  if (h.critical_path?.length) {
    o += `<div style="margin-top:8px;font-size:12px">Critical path: ${h.critical_path.map(c => `<strong>${esc(c)}</strong>`).join(', ')}</div>`;
  }
  if (h.last_updated) o += `<div style="margin-top:4px;font-size:11px;color:#80868b">Last updated: ${esc(h.last_updated)}</div>`;
  o += '</div>';
  if (h.checkpoint) {
    o += '<div class="card"><div class="card-title">Checkpoint Summary</div>';
    if (h.checkpoint.overall_verdict) o += `<p>${esc(h.checkpoint.overall_verdict)}</p>`;
    if (h.checkpoint.key_flags) {
      o += '<ul style="margin-top:8px;padding-left:20px;list-style:disc">';
      h.checkpoint.key_flags.forEach(f => { o += `<li style="margin:4px 0;font-size:13px">${esc(f)}</li>`; });
      o += '</ul>';
    }
    o += '</div>';
  }
  const hyps = h.hypotheses || [];
  const critical = h.critical_path || [];
  hyps.forEach(hyp => { o += renderHypNode(hyp, critical, false); });
  return o;
}

function renderHypNode(hyp, critical, isSub) {
  const isCrit = critical.includes(hyp.id);
  let cls = isSub ? '' : (isCrit ? ' hyp-critical' : '');
  let o = `<div class="hyp-item${cls}">`;
  o += '<div class="hyp-header">';
  o += `<span class="hyp-id">${esc(hyp.id)}</span>`;
  o += `<span class="hyp-statement">${esc(hyp.statement || '')}</span>`;
  o += badge(hyp.status || 'testing');
  if (hyp.confidence) o += ` <span class="hyp-confidence">${esc(hyp.confidence)}</span>`;
  if (hyp.priority) o += ` <span class="hyp-confidence">[${esc(hyp.priority)}]</span>`;
  o += '</div>';
  const efor = hyp.evidence_for || [];
  const eagainst = hyp.evidence_against || [];
  if (efor.length || eagainst.length) {
    o += '<div class="hyp-evidence">';
    if (efor.length) o += `<div>\u2705 For: ${efor.map(e => esc(String(e))).join(', ')}</div>`;
    if (eagainst.length) o += `<div>\u274C Against: ${eagainst.map(e => esc(String(e))).join(', ')}</div>`;
    o += '</div>';
  }
  if (hyp.refinement) o += `<div style="margin-top:4px;font-size:12px;color:#b06000">Refinement: ${esc(hyp.refinement)}</div>`;
  const subs = hyp.sub_hypotheses || [];
  if (subs.length) {
    o += '<div class="hyp-children">';
    subs.forEach(s => { o += renderHypNode(s, critical, true); });
    o += '</div>';
  }
  o += '</div>';
  return o;
}

// ===================================================================
// Registry-aware document table renderer (shared by all doc sections)
// ===================================================================
const _allFilesByName = {};
function _ensureFileIndex() {
  if (Object.keys(_allFilesByName).length) return;
  [...(DATA.research||[]), ...(DATA.analysis||[]), ...(DATA.models||[]),
   ...(DATA.findings||[]), ...(DATA.reviews||[]), ...(DATA.deliverables||[])].forEach(f => {
    _allFilesByName[f.filename] = f;
  });
}

function _groupRegDocs(docs) {
  const groups = {};
  docs.forEach(d => {
    const base = d.id.replace(/-V\d+$/, '');
    if (!groups[base]) groups[base] = [];
    groups[base].push(d);
  });
  Object.values(groups).forEach(g => {
    g.sort((a, b) => {
      if (a.status === 'final' && b.status !== 'final') return -1;
      if (b.status === 'final' && a.status !== 'final') return 1;
      const va = (a.version || 'V00').replace(/^V/, '');
      const vb = (b.version || 'V00').replace(/^V/, '');
      return vb.localeCompare(va, undefined, {numeric: true});
    });
  });
  return Object.values(groups);
}

function renderRegTable(docs, label) {
  _ensureFileIndex();
  const groups = _groupRegDocs(docs);
  let o = `<div class="card"><div class="card-title">${esc(label)} (${groups.length})</div>`;
  o += '<table class="data-table" style="table-layout:fixed"><colgroup>';
  o += '<col style="width:100px"><col style="width:auto"><col style="width:70px"><col style="width:50px"><col style="width:45px"><col style="width:80px">';
  o += '</colgroup>';
  o += '<tr><th>ID</th><th>Title</th><th>Author</th><th>WS</th><th>V</th><th>Status</th></tr>';
  groups.forEach(g => {
    const d = g[0];
    const prev = g.slice(1);
    const roleColor = COLORS[d.role] || '#5f6368';
    const fname = d.path ? d.path.split('/').pop() : '';
    const fileData = _allFilesByName[fname];
    const docId = 'rdoc' + (docCounter++);
    const prevId = 'rprev' + docCounter;

    o += `<tr style="cursor:pointer" onclick="toggleDoc('${docId}')">`;
    o += `<td><strong>${esc(d.id)}</strong></td>`;
    o += '<td style="overflow:hidden;text-overflow:ellipsis">';
    o += esc(d.title || '');
    if (prev.length) {
      o += ` <span class="prev-toggle" onclick="event.stopPropagation();togglePrevGroup('${prevId}')">(+${prev.length} prev)</span>`;
    }
    o += '</td>';
    o += `<td><span style="color:${roleColor};font-weight:500">${esc(d.author || '')}</span></td>`;
    o += `<td>${esc(d.workstream || '')}</td>`;
    o += `<td>${esc(d.version || '')}</td>`;
    o += `<td>${badge(d.status)}</td>`;
    o += '</tr>';

    if (fileData?.type === 'md' && fileData.content) {
      _storeMd(docId, fileData.content);
      o += `<tr id="${docId}" style="display:none"><td colspan="6"><div class="doc-content md" style="display:block;max-height:600px;overflow-y:auto;white-space:normal;word-wrap:break-word;position:relative"><button class="copy-md-btn" title="Copy markdown" onclick="event.stopPropagation();copyMd('${docId}', this)">\u{1F4CB} Copy MD</button>${md2html(fileData.content)}</div></td></tr>`;
    } else if (d.path) {
      // Non-MD file: show link to open the file
      const ext = (d.path.split('.').pop() || '').toLowerCase();
      const icons = { xlsx: '\u{1F4CA}', xls: '\u{1F4CA}', pdf: '\u{1F4C4}', docx: '\u{1F4DD}', doc: '\u{1F4DD}', pptx: '\u{1F4CA}', ppt: '\u{1F4CA}', csv: '\u{1F4CB}' };
      const fileIcon = icons[ext] || '\u{1F4CE}';
      o += `<tr id="${docId}" style="display:none"><td colspan="6"><div class="doc-content" style="display:block;padding:12px 20px">`
        + `${fileIcon} <a href="${esc(d.path)}" target="_blank" style="color:#1a73e8;font-weight:500">${esc(d.path)}</a>`
        + ` <span style="color:#80868b;font-size:12px">(.${esc(ext)})</span></div></td></tr>`;
    }

    if (prev.length) {
      prev.forEach(p => {
        const pRoleColor = COLORS[p.role] || '#5f6368';
        o += `<tr class="prev-row" data-prevgroup="${prevId}" style="display:none">`;
        o += `<td>${esc(p.id)}</td>`;
        o += `<td style="overflow:hidden;text-overflow:ellipsis">${esc(p.title || '')}`;
        if (p.superseded_by) o += ` <span style="font-size:10px">\u2192 ${esc(p.superseded_by)}</span>`;
        o += '</td>';
        o += `<td><span style="color:${pRoleColor}">${esc(p.author || '')}</span></td>`;
        o += `<td>${esc(p.workstream || '')}</td>`;
        o += `<td>${esc(p.version || '')}</td>`;
        o += `<td>${badge(p.status)}</td>`;
        o += '</tr>';
      });
    }
  });
  o += '</table></div>';
  return o;
}

// Canonical type mapping: fuzzy-match common variants to known types
const TYPE_ALIASES = {
  'research': 'research-brief', 'research-brief': 'research-brief',
  'analysis': 'analysis-memo', 'analysis-memo': 'analysis-memo',
  'model': 'model', 'financial-model': 'model',
  'model-summary': 'model-summary',
  'interim-report': 'interim-report', 'report': 'interim-report',
  'deck': 'deck', 'presentation': 'deck', 'slide-deck': 'deck',
  'roadmap': 'roadmap', 'implementation-roadmap': 'roadmap',
  'appendix': 'appendix',
  'finding': 'finding', 'findings': 'finding',
  'deliverable': 'deliverable', 'final-deliverable': 'deliverable',
  'review': 'review', 'qa-review': 'review', 'partner-review': 'review',
  'client-lens-review': 'review'
};
function _canonicalType(t) {
  if (!t) return t;
  const lower = t.toLowerCase().trim();
  if (TYPE_ALIASES[lower]) return TYPE_ALIASES[lower];
  // Prefix match: "analysis-xyz" → "analysis-memo", "research-xyz" → "research-brief"
  for (const [alias, canonical] of Object.entries(TYPE_ALIASES)) {
    if (lower.startsWith(alias)) return canonical;
  }
  return t; // unrecognized — keep as-is
}

function _regDocsOfTypes(types) {
  return (DATA.document_registry?.documents || []).filter(d =>
    !d._example && types.includes(_canonicalType(d.type))
  );
}

function _unmatchedRegDocs() {
  const allKnown = new Set(Object.values(TYPE_ALIASES));
  return (DATA.document_registry?.documents || []).filter(d =>
    !d._example && !allKnown.has(_canonicalType(d.type))
  );
}

function renderProjectData() {
  let o = '<h2 class="section-title">Project Data</h2>';
  const projectTypes = ['research-brief', 'analysis-memo', 'model', 'model-summary',
    'interim-report', 'deck', 'roadmap', 'appendix'];
  const regDocs = _regDocsOfTypes(projectTypes);

  // Also collect unmatched docs
  const unmatchedDocs = _unmatchedRegDocs();
  const allDocs = [...regDocs, ...unmatchedDocs];

  if (allDocs.length) {
    const typeLabels = {
      'research-brief': 'Research Briefs', 'analysis-memo': 'Analysis Memos',
      'model': 'Models', 'model-summary': 'Model Summaries',
      'interim-report': 'Interim Reports', 'deck': 'Decks',
      'roadmap': 'Roadmaps', 'appendix': 'Appendices'
    };
    const finalCount = allDocs.filter(d => d.status === 'final').length;
    const supersededCount = allDocs.filter(d => d.status === 'superseded').length;
    o += '<div class="stats-grid">';
    o += statCard(allDocs.length, 'Total');
    o += statCard(finalCount, 'Final');
    o += statCard(supersededCount, 'Superseded');
    o += '</div>';

    if (unmatchedDocs.length) {
      const typeList = [...new Set(unmatchedDocs.map(d => d.type))].join(', ');
      o += `<div style="background:#fff3cd;border:1px solid #ffc107;border-radius:8px;padding:12px 16px;margin-bottom:12px;font-size:13px;color:#664d03">`
        + `\u26A0 ${unmatchedDocs.length} document${unmatchedDocs.length > 1 ? 's' : ''} with unrecognized type${unmatchedDocs.length > 1 ? 's' : ''}`
        + ` (${esc(typeList)}) \u2014 check document-registry.json</div>`;
    }

    projectTypes.forEach(type => {
      const typeDocs = regDocs.filter(d => _canonicalType(d.type) === type);
      if (!typeDocs.length) return;
      o += renderRegTable(typeDocs, typeLabels[type] || type);
    });

    if (unmatchedDocs.length) {
      o += renderRegTable(unmatchedDocs, 'Other');
    }
    return o;
  }

  // Fallback: no registry
  let hasContent = false;
  [{ data: DATA.research, label: 'Research Briefs' },
   { data: DATA.analysis, label: 'Analysis Memos' },
   { data: DATA.models, label: 'Models' }].forEach(s => {
    if (s.data?.length) { hasContent = true; o += versionedDocList(s.data, s.label); }
  });
  if (!hasContent) o += empty('\u{1F4C2}', 'No project data yet.');
  return o;
}

    o += `<td>${esc(s.published||'')}</td>`;
    o += '</tr>';
    if (s.key_data_points?.length) {
      o += `<tr><td></td><td colspan="5" style="font-size:12px;color:#5f6368;padding-top:0">${s.key_data_points.map(d => esc(d)).join(' | ')}</td></tr>`;
    }
  });
  o += '</table></div>';
  return o;
}

// ===================================================================
// Navigation
// ===================================================================
const SECTIONS = [
  { id: 'overview',      label: 'Overview',       icon: '\u25C9', render: renderOverview },
  { id: 'team',          label: 'Team',           icon: '\u{1F465}', render: renderTeam },
  { id: 'drumbeat',      label: 'Drumbeat',       icon: '\u{1F504}', render: renderDrumbeat },
  { id: 'workstreams',   label: 'Workstreams',    icon: '\u{1F4CB}', render: renderWorkstreams,
    count: () => DATA.workstreams?.workstreams?.length || 0 },
  { id: 'hypotheses',    label: 'Hypotheses',     icon: '\u{1F9EA}', render: renderHypotheses,
    count: () => DATA.hypotheses?.hypotheses?.length || 0 },
  { id: 'sep1' },
  { id: 'projectdata',   label: 'Project Data',   icon: '\u{1F4C1}', render: renderProjectData,
    count: () => {
      const r = _regDocsOfTypes(['research-brief','analysis-memo','model','model-summary','interim-report','deck','roadmap','appendix']);
      return (r.length + _unmatchedRegDocs().length) || (cnt(DATA.research) + cnt(DATA.analysis) + cnt(DATA.models));
    }},
  { id: 'findings',      label: 'Findings',       icon: '\u{1F4A1}', render: renderFindings,
    count: () => _regDocsOfTypes(['finding']).length || cnt(DATA.findings) },
  { id: 'deliverables',  label: 'Deliverables',   icon: '\u{1F4E6}', render: renderDeliverables,
    count: () => _regDocsOfTypes(['deliverable']).length || cnt(DATA.deliverables) },
  { id: 'reviews',       label: 'Reviews',        icon: '\u{1F50D}', render: renderReviews,
    count: () => _regDocsOfTypes(['review']).length || cnt(DATA.reviews) },
  { id: 'clientdata',    label: 'Client Data',    icon: '\u{1F4C2}', render: renderClientData,
    count: () => cnt(DATA.client_data) },
  { id: 'sep2' },
  { id: 'sources',       label: 'Sources',        icon: '\u{1F4DA}', render: renderSources,
    count: () => realSources().length },
];

let activeSection = 'overview';

function navigate(id) {
  activeSection = id;
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.section === id);
  });
  const sec = SECTIONS.find(s => s.id === id);
  const main = document.getElementById('main');
  if (sec?.render) { docCounter = 0; main.innerHTML = sec.render(); }
  window.scrollTo(0, 0);
}

function init() {
  buildHypLookup();
  const e = DATA.engagement;
  document.getElementById('sidebar-name').textContent = e?.name || 'No engagement';
  const phaseNames = ['0-scoping', '1-discovery', '2-analysis', '3-synthesis'];
  const resolvedIdx = resolveCurrentPhase();
  document.getElementById('sidebar-phase').textContent =
    resolvedIdx >= 0 && resolvedIdx < phaseNames.length ? phaseNames[resolvedIdx] : (e?.phase || '\u2014');
  document.getElementById('build-time').textContent = DATA.build_time || '\u2014';
  document.title = 'Management Consulting Team Dashboard' + (e?.name ? ' \u2014 ' + e.name : '');
  // Build nav
  const nav = document.getElementById('nav-list');
  SECTIONS.forEach(s => {
    if (s.id.startsWith('sep')) {
      const sep = document.createElement('li');
      sep.innerHTML = '<div class="nav-sep"></div>';
      nav.appendChild(sep);
      return;
    }
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.className = 'nav-item' + (s.id === activeSection ? ' active' : '');
    a.dataset.section = s.id;
    a.onclick = () => navigate(s.id);
    a.innerHTML = `<span class="nav-icon">${s.icon}</span>${s.label}`;
    if (s.count) {
      const c = s.count();
      if (c > 0) a.innerHTML += `<span class="nav-count">${c}</span>`;
    }
    li.appendChild(a);
    nav.appendChild(li);
  });
  navigate(activeSection);
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
